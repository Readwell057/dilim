name: Windows uygulamasını derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri yükle
        run: npm install
      - name: Çekirdek testleri (hata verirse derleme yine de sürer)
        run: npm test
        continue-on-error: true
      - name: Windows uygulamasını oluştur
        run: npm run dist
      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: Dilim-Windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Sürüm olarak yayınla (yalnızca v1.0.0 gibi etiketlerde)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
